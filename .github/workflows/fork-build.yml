# Builds TOSS Terminal for macOS as an unsigned app and uploads it as an
# artifact. Upstream's release.yml needs signing secrets this fork doesn't
# have. TOSS Terminal has its own identifier (app.toss.terminal) and no
# updater; new builds are installed by hand.
name: fork-build

on:
  workflow_dispatch:
  push:
    branches: [tuios-tiling, tuios-tiling-v086]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build the unsigned app
        run: pnpm tauri build --bundles app --no-sign
      - name: Test dictation, migration and agent detection
        working-directory: src-tauri
        run: cargo test --release --lib -- stt::tests migrate::tests agent_detect::tests
      - name: Measure the app
        working-directory: src-tauri/target/release/bundle/macos
        run: du -sh "TOSS Terminal.app" "TOSS Terminal.app/Contents/MacOS/"*
      - name: Zip the app
        working-directory: src-tauri/target/release/bundle/macos
        run: ditto -c -k --keepParent "TOSS Terminal.app" toss-terminal-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: toss-terminal-macos
          path: src-tauri/target/release/bundle/macos/toss-terminal-macos.zip
